<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Isoprene: The Terpene Game</title>
  </head>
  <body class="bg-black text-white min-h-screen items-center flex flex-col">
    A quick message from Isoprene: Isoprene is in development.
    <div class="w-[95%] md:max-w-md mx-auto bg-slate-900 p-4 md:p-6 rounded-3xl border border-slate-800 text-center">
      <!-- Canvas wrapper -->
      <div class="w-full aspect-square bg-slate-950 rounded-2xl border border-slate-800 p-2 inline-block mb-4">
        <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>
      </div>
    </div>
    <script>
      const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 1. STORE COORDINATES AS RELATIVE RATIOS (0.0 to 1.0)
const relativeNodes = [
    { id: 0, rx: 0.15, ry: 0.50, label: "C1" },
    { id: 1, rx: 0.40, ry: 0.35, label: "C2" }, // Central Branch Point
    { id: 2, rx: 0.65, ry: 0.50, label: "C3" },
    { id: 3, rx: 0.85, ry: 0.35, label: "C4" },
    { id: 4, rx: 0.40, ry: 0.70, label: "C5" }  // Methyl tail
];

// 2. THE DYNAMIC AUTO-RESIZE FUNCTION
function resizeCanvas() {
    // Get the actual width of the canvas container calculated by Tailwind
    const displayWidth = canvas.clientWidth;
    
    // Set the canvas internal drawing pixels to match its display size exactly
    // This prevents any screen blurriness on high-definition mobile displays
    canvas.width = displayWidth;
    canvas.height = displayWidth; // Keeps it a perfect square
    
    // Draw the scene immediately after resizing
    drawScene();
}

// 3. DRAW SCENE USING CONVERTED PIXEL VALUES
function drawScene() {
    // 1. Clear the canvas frame before every repaint pass
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 2. DYNAMICALLY SCALE SIZES BASED ON THE RESPONSIVE CANVAS WIDTH
    const nodeRadius = canvas.width * 0.045;       // Circles are 4.5% of canvas width
    const baseLineWidth = canvas.width * 0.012;    // Single lines are 1.2% of canvas width
    const doubleOffset = canvas.width * 0.016;     // Spacing vector between parallel lines
    
    // Convert your relative coordinates (0.0 to 1.0) into exact pixel values for this layout frame
    const scaledNodes = relativeNodes.map(node => ({
        id: node.id,
        x: node.rx * canvas.width,
        y: node.ry * canvas.height,
        label: node.label
    }));

    // Local tracker dictionary to prevent drawing identical bonds twice
    let processedPairs = {};

    // 3. STEP A: RENDER THE MOLECULAR TRACKS (BONDS)
    currentBonds.forEach(bond => {
        let c1 = Math.min(bond[0], bond[1]);
        let c2 = Math.max(bond[0], bond[1]);
        let key = `${c1}_${c2}`;

        // If we already evaluated this bond pair, skip it to optimize performance
        if (processedPairs[key]) return;

        // Count array occurrences to detect bond types (1 = Single, 2 = Double)
        let order = currentBonds.filter(b => (b[0]===c1 && b[1]===c2) || (b[0]===c2 && b[1]===c1)).length;
        let p1 = scaledNodes[c1];
        let p2 = scaledNodes[c2];

        ctx.lineCap = "round";

        if (order === 1) {
            // Draw a pristine, clean single bond path
            ctx.lineWidth = baseLineWidth;
            ctx.strokeStyle = "#334155"; // Subtle dark slate structural track
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        } else if (order === 2) {
            // Draw a high-energy double bond path using parallel offset geometry
            ctx.lineWidth = baseLineWidth * 0.9; // Make individual tracks slightly thinner
            ctx.strokeStyle = "#10b981";       // Glowing emerald green for active double bonds
            
            // Calculate direction vector components
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let len = Math.sqrt(dx * dx + dy * dy);
            
            // Generate perpendicular unit offset values
            let ox = (-dy / len) * doubleOffset;
            let oy = (dx / len) * doubleOffset;

            // Line track 1
            ctx.beginPath();
            ctx.moveTo(p1.x + ox, p1.y + oy);
            ctx.lineTo(p2.x + ox, p2.y + oy);
            ctx.stroke();
            
            // Line track 2
            ctx.beginPath();
            ctx.moveTo(p1.x - ox, p1.y - oy);
            ctx.lineTo(p2.x - ox, p2.y - oy);
            ctx.stroke();
        }
        
        processedPairs[key] = true; // Mark pair group as rendered
    });

    // 4. STEP B: RENDER THE CARBON INTERSECTIONS (NODES)
    scaledNodes.forEach(node => {
        ctx.lineWidth = canvas.width * 0.008; // Outline thickness scale

        // Change color state dynamically if player has clicked a node to begin a swing action
        if (selectedNodeFrom !== null && selectedNodeFrom.id === node.id) {
            ctx.fillStyle = "#f59e0b";   // Radiant amber fill for the active selection
            ctx.strokeStyle = "#fbbf24"; // Bright gold border ring
        } else {
            ctx.fillStyle = "#0f172a";   // Dark slate background match
            ctx.strokeStyle = "#475569"; // Cool gray border ring
        }

        // Draw the main carbon circle
        ctx.beginPath();
        ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Draw the text string labels perfectly in the center of the node circle
        ctx.fillStyle = (selectedNodeFrom !== null && selectedNodeFrom.id === node.id) ? "#0f172a" : "#94a3b8";
        ctx.font = `bold ${canvas.width * 0.03}px monospace`; // Scales font size relative to screen
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(node.label, node.x, node.y);
    });
                                }
      
// 4. BIND TO WINDOW RESIZE EVENTS
// Automatically recalculates everything if a mobile user switches to landscape mode
window.addEventListener('resize', resizeCanvas);
window.addEventListener('DOMContentLoaded', resizeCanvas);
      
    </script>
  </body>
</html>
